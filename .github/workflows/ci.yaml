name: CI

on:
  pull_request:
    paths-ignore:
    - "**.md"
    - "docs/**"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - run: make build
    - run: make vet
    - run: make fmt
    - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - run: >-
        go run gotest.tools/gotestsum
        --jsonfile unit-tests.json
        --format testdox
        --
        -v -cover -coverpkg=./... -coverprofile=coverage.txt -covermode=atomic
        -timeout 20m ./...
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: unit-tests.json
      if: ${{ !cancelled() }}

  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - run: >-
        echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest use 1.36.2 -p path)"
        >> "$GITHUB_ENV"
    - run: go test -tags integration -v -timeout 20m ./test/integration/... ./cmd/...

  manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - run: make manifests && git diff --exit-code -- deploy/standard/role.yaml
    - # kubectl apply --dry-run=client still requires live API server access
      # (for RESTMapper discovery, even of built-in types), which no cluster
      # is available for here; kubeconform validates offline instead, and
      # -ignore-missing-schemas skips CRD kinds like ServiceMonitor that it
      # has no schema for.
      run: >-
        go run sigs.k8s.io/kustomize/kustomize/v5 build deploy/standard
        | go run github.com/yannh/kubeconform/cmd/kubeconform -summary -ignore-missing-schemas
    - run: >-
        go run sigs.k8s.io/kustomize/kustomize/v5 build deploy/dev
        | go run github.com/yannh/kubeconform/cmd/kubeconform -summary -ignore-missing-schemas
    - run: >-
        go run sigs.k8s.io/kustomize/kustomize/v5 build deploy/e2e
        | go run github.com/yannh/kubeconform/cmd/kubeconform -summary -ignore-missing-schemas
    - run: >-
        go run sigs.k8s.io/kustomize/kustomize/v5 build deploy/e2e-legacy
        | go run github.com/yannh/kubeconform/cmd/kubeconform -summary -ignore-missing-schemas

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        # v1.36 is current, so this leg exercises the default (EndpointSlice-only)
        # path; v1.31 predates the 1.33 Endpoints deprecation, so this leg
        # enables --write-legacy-endpoints and exercises that path too.
        - name: current
          k3s-image: rancher/k3s:v1.36.4-k3s1
          overlay: deploy/e2e
          write-legacy-endpoints: false
        - name: legacy-endpoints
          k3s-image: rancher/k3s:v1.31.14-k3s1
          overlay: deploy/e2e-legacy
          write-legacy-endpoints: true
    name: e2e (${{ matrix.name }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - # kind runs vanilla upstream Kubernetes, which labels control-plane
      # nodes differently from k3s (empty value vs "true"); k3d runs real
      # k3s binaries, so it actually exercises this controller's k3s-specific
      # assumptions.
      run: curl -sf https://raw.githubusercontent.com/k3d-io/k3d/v5.9.0/install.sh | TAG=v5.9.0 bash
    - run: k3d cluster create k3s-prometheus-metrics --image ${{ matrix.k3s-image }} --wait
    - run: >-
        KO_DOCKER_REPO=k3s-prometheus-metrics
        go run github.com/google/ko@v0.19.1 build --local --bare -t e2e ./cmd/k3s-prometheus-metrics
    - run: k3d image import k3s-prometheus-metrics:e2e -c k3s-prometheus-metrics
    - run: kubectl apply -k ${{ matrix.overlay }}
    - run: kubectl -n monitoring rollout status deployment/k3s-prometheus-metrics --timeout=60s
    - run: go test -tags e2e -v -timeout 20m ./test/e2e/...
      env:
        E2E_LEGACY_ENDPOINTS: ${{ matrix.write-legacy-endpoints }}
