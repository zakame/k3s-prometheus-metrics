# Bound cluster-wide because Node objects are cluster-scoped (the
# controller must list/watch all nodes to find control-plane members).
# role.yaml (generated) now grants only read access to nodes -- the
# namespace-scoped EndpointSlice/Endpoints and leader-election Lease
# permissions live in role-endpoints.yaml and role-leader-election.yaml,
# bound via their own namespaced RoleBindings, so this ClusterRoleBinding
# no longer grants anything beyond cluster-wide node read access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-prometheus-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k3s-prometheus-metrics
subjects:
- kind: ServiceAccount
  name: k3s-prometheus-metrics
  namespace: monitoring
